<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Inner glowing symbol -->
  <g filter="url(#glow)">
    <!-- Play / Camera / Creative Aperture Monogram -->
    <circle cx="256" cy="256" r="160" fill="none" stroke="url(#accentGrad)" stroke-width="8" stroke-dasharray="20 10" opacity="0.6" />
    <circle cx="256" cy="256" r="120" fill="#0f172a" fill-opacity="0.8" stroke="url(#accentGrad)" stroke-width="6" />

    <!-- Smaily 'S' and Media Center Play Triangle -->
    <path d="M 210 180 C 270 150, 310 210, 256 256 C 200 300, 240 360, 300 330" fill="none" stroke="url(#accentGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="280,236 330,266 280,296" fill="#10b981" />
  </g>

  <!-- Modern SMC Text Monogram at bottom -->
  <text x="256" y="430" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="44" fill="#f8fafc" letter-spacing="6">SMC</text>
  <text x="256" y="460" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="20" fill="#10b981" letter-spacing="3">SMAILY MEDIA</text>
</svg>

